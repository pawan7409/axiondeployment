name: Terraform Infrastructure

on:
  push:
    branches:
      - main
      - feature/axion
    paths:
      - 'FinalProject/axion-ingestion-service/terraform/**'
      - '.github/workflows/terraform-infra.yml'
  pull_request:
    paths:
      - 'FinalProject/axion-ingestion-service/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Validate and deploy infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FinalProject/axion-ingestion-service/terraform

    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_subscription_id: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_VAR_jumpbox_admin_password: ${{ secrets.JUMPBOX_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
