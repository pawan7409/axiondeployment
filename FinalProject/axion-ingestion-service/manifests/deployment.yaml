apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ingestion-service
  template:
    metadata:
      labels:
        app: axion-ingestion-service
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: axion-ingestion-service
        image: axionprojectregistry.azurecr.io/ingestion:v1
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
