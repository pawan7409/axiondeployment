apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'axion-ingestion-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['axion-ingestion-service.default.svc.cluster.local:8000']
